<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>燦坤華榮 AppleShop · 活動紀錄</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --line: #06C755; --fb: #1877F2; --google: #FBBC05; --yellow: #FFD500;
    --bg: #000; --card: #1c1c1e; --card-2: #2c2c2e; --border: rgba(255,255,255,0.07);
    --text: #fff; --text-2: #8e8e93; --text-3: #48484a;
    --up: #30D158; --down: #FF453A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--text-2); }
  .line { --c: var(--line); } .fb { --c: var(--fb); } .google { --c: var(--google); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }

  /* 標題 */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  header .sub { font-size: 13px; color: var(--text-2); margin-top: 4px; }
  header .sub b { color: var(--yellow); font-weight: 600; }
  .btn {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 9px 14px; border-radius: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--yellow); color: #000; border-color: transparent; }
  .btn:disabled { opacity: 0.5; }

  /* 區塊 */
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .section-title h2 { font-size: 16px; font-weight: 700; }
  .section-title .hint { font-size: 12px; color: var(--text-2); text-align: right; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }

  /* ① 真實數據 */
  .kpi-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 760px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  .kpi { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c); }
  .kpi-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-2); }
  .kpi-head .nm { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
  .kpi-cur { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
  .kpi-cur small { font-size: 15px; font-weight: 600; color: var(--text-2); margin-left: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--card-2); }
  .chip .lb { color: var(--text-2); font-weight: 500; margin-right: 4px; }
  .since { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
           padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 12%, transparent); }
  .since .lb { font-size: 12px; color: var(--text-2); }
  .since .v { font-size: 22px; font-weight: 800; }
  .since .note { font-size: 11px; color: var(--text-2); margin-top: 2px; }
  .spark { position: relative; height: 54px; }
  .spark-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-3); }

  /* ② 點擊 × 實際加入 */
  .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--card-2);
          overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
         border: 0; background: transparent; color: var(--text-2); padding: 7px 12px; border-radius: 8px; }
  .tab.active { background: var(--yellow); color: #000; }
  .cmp-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 760px) { .cmp-grid { grid-template-columns: repeat(4, 1fr); } }
  .cmp { background: var(--card-2); border-radius: 12px; padding: 14px; border-top: 3px solid var(--c); }
  .cmp.total { --c: var(--yellow); }
  .cmp-nm { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .cmp-row { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 0; }
  .cmp-row .lb { font-size: 12px; color: var(--text-2); }
  .cmp-row .v { font-size: 22px; font-weight: 800; }
  .cmp-row .v small { font-size: 12px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
  .cmp-row.conv .v { font-size: 14px; font-weight: 600; color: var(--text-2); }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; margin: 6px 0 2px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 3px; transition: width 0.6s ease; }
  .goal { font-size: 11px; color: var(--text-2); }
  .cmp-foot { font-size: 11px; color: var(--text-2); margin-top: 12px; line-height: 1.5; }
  .loading { opacity: 0.5; transition: opacity 0.2s; }

  /* ③ 每日明細 + 月曆 */
  .two-col { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) {
    /* 兩欄等寬、等高：卡片撐滿欄高，月曆格子平均分配多出的高度 */
    .two-col { grid-template-columns: 1fr 1fr; align-items: stretch; }
    .two-col > div { display: flex; flex-direction: column; }
    .two-col > div > .card { flex: 1; }
    .cal-card { display: flex; flex-direction: column; }
    .cal-card .cal-grid { flex: 1; grid-auto-rows: minmax(38px, 1fr); }
    .cal-card .cal-cell { height: auto; }
  }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 12px; font-weight: 600; color: var(--text-2); border-bottom: 1px solid var(--border); }
  thead th .dot { margin-right: 4px; vertical-align: 1px; }
  thead tr.sub th { font-size: 11px; font-weight: 500; padding-top: 0; }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  tbody td .wk { color: var(--text-2); margin-left: 4px; font-size: 12px; }
  tbody tr.today td:first-child { color: var(--yellow); font-weight: 700; }
  tfoot td { font-weight: 700; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }
  td.clk { color: var(--text); font-weight: 600; }
  td.act { font-weight: 600; }
  td.gap-l { padding-left: 14px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head h3 { font-size: 16px; font-weight: 700; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { min-width: 32px; height: 32px; padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer;
                    border: 0; border-radius: 8px; background: var(--card-2); color: var(--text); }
  .cal-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
  .cal-weekdays .weekend { color: var(--down); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell { height: 38px; position: relative; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
              border: 0; border-radius: 8px; background: transparent; color: var(--text); }
  .cal-cell.empty { pointer-events: none; }
  .cal-cell.future { color: var(--text-3); pointer-events: none; }
  .cal-cell.today { color: var(--yellow); font-weight: 700; }
  .cal-cell:not(.empty):not(.future):hover { background: var(--card-2); }
  .cal-cell.selected { background: var(--yellow); color: #000; font-weight: 700; }
  .cal-cell .activity { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%);
                        width: 4px; height: 4px; border-radius: 50%; background: var(--yellow); }
  .cal-cell.selected .activity { display: none; }
  .cal-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .day-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .day-title .wk { color: var(--text-2); font-weight: 500; margin-left: 4px; font-size: 13px; }
  .day-title .badge { font-size: 11px; background: var(--yellow); color: #000; padding: 2px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
  .day-tbl td { padding: 7px 4px; }
  .day-tbl td.nm { color: var(--text-2); }
  .day-tbl td.nm .dot { margin-right: 8px; vertical-align: 1px; }

  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  footer .meta { font-size: 12px; color: var(--text-2); }
  footer .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 純點擊模式：隱藏所有「實際加入」 */
  .mode-off #ext-card, .mode-off .actual { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>活動紀錄</h1>
      <div class="sub">燦坤華榮 AppleShop　·　<b id="today-date">— —</b></div>
    </div>
    <button class="btn primary" id="btn-refresh" onclick="loadAll(true)">重新整理</button>
  </header>

  <!-- ① 真實數據 -->
  <section id="ext-card">
    <div class="section-title"><h2>真實數據</h2><span class="hint" id="ext-meta-r">每 5 分鐘自動更新</span></div>
    <div class="kpi-grid" id="kpi-grid"></div>
  </section>

  <!-- ② 點擊 × 實際加入 -->
  <section>
    <div class="section-title"><h2>點擊 × 實際加入</h2><span class="hint">點擊＝落地頁按鈕次數　·　實際加入＝平台真實數字增加</span></div>
    <div class="card" id="cmp-card">
      <div class="tabs" id="tabs"></div>
      <div class="cmp-grid" id="cmp-grid"></div>
      <div class="cmp-foot actual" id="cmp-foot"></div>
    </div>
  </section>

  <!-- ③ 每日明細 + 月曆 -->
  <section class="two-col">
    <div>
      <div class="section-title"><h2>每日明細</h2><span class="hint">近 14 天</span></div>
      <div class="card tbl-wrap">
        <table class="num">
          <thead>
            <tr>
              <th rowspan="2">日期</th>
              <th colspan="2" class="gap-l"><span class="dot line"></span>LINE</th>
              <th colspan="2" class="gap-l"><span class="dot fb"></span>FB</th>
              <th colspan="2" class="gap-l"><span class="dot google"></span>Google</th>
            </tr>
            <tr class="sub">
              <th class="gap-l">點擊</th><th class="actual">加入</th>
              <th class="gap-l">點擊</th><th class="actual">加入</th>
              <th class="gap-l">點擊</th><th class="actual">評論</th>
            </tr>
          </thead>
          <tbody id="daily-body"><tr><td colspan="7" class="flat">載入中…</td></tr></tbody>
          <tfoot id="daily-foot"></tfoot>
        </table>
      </div>
    </div>

    <div>
      <div class="section-title"><h2>月曆</h2><span class="hint">點日期看當天</span></div>
      <div class="card cal-card">
        <div class="cal-head">
          <h3 id="cal-title">— —</h3>
          <div class="cal-nav">
            <button id="cal-prev" aria-label="上個月">‹</button>
            <button id="cal-today">今天</button>
            <button id="cal-next" aria-label="下個月">›</button>
          </div>
        </div>
        <div class="cal-weekdays">
          <div class="weekend">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="weekend">六</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-detail">
          <div class="day-title" id="day-title">選擇日期查看明細</div>
          <table class="day-tbl num">
            <thead><tr><th></th><th>點擊</th><th class="actual">實際加入</th></tr></thead>
            <tbody id="day-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="meta" id="meta">資料載入中…</div>
    <div class="actions">
      <button class="btn" onclick="window.open('https://magicbrian1206-maker.github.io/landing/','_blank')">開啟落地頁</button>
      <button class="btn" id="btn-excel" onclick="exportExcel()">下載 Excel</button>
    </div>
  </footer>

</div>

<script>
const NS = 'tsann-kuen-appleshop';
// ===== 真實數據模式：'off' 純點擊 / 'manual' 手動填數字 / 'api' 自動串接 =====
// 產生器會依店家選擇改這一行；預設 api = 打自己的 /external 端點
const REAL_DATA_MODE = 'api';   /*__REAL_DATA_MODE__*/
const API_BASE = 'https://tsann-counter.magicbrian1206.workers.dev';
const SINCE_YMD = '20260516';   // 累計起點：三平台統一從 5/16 起算（FB 接上日）
const BRANDS = ['line', 'fb', 'google'];
// 計數器資料鍵：fb 用 'facebook'（Worker 鍵長度需 ≥3）
const DATA_KEY = { line: 'line', fb: 'facebook', google: 'google' };
const META = {
  line:   { name: 'LINE 好友',   click: '加 LINE 好友',     color: '#06C755', unit: '' },
  fb:     { name: 'FB 追蹤數',   click: '點進 FB 粉絲團',   color: '#1877F2', unit: '' },
  google: { name: 'Google 評論', click: '點進 Google 評論', color: '#FBBC05', unit: ' 則' },
};
// 每日快照鍵前綴（實際數字）
const SNAP_PREFIX = REAL_DATA_MODE === 'manual'
  ? { line: ['rd-line-d-'], fb: ['rd-fb-d-'], google: ['rd-google-d-'] }
  : { line: ['line-friends-d-'], fb: ['facebook-followers-d-', 'facebook-fans-d-'], google: ['google-reviews-d-'] };
const PERIODS = [
  { id: 'today', label: '今日',   goal: 5 },
  { id: 'week',  label: '本週',   goal: 25 },
  { id: 'month', label: '本月',   goal: 50 },
  { id: '3m',    label: '3 個月', goal: 150 },
  { id: '6m',    label: '半年',   goal: 300 },
  { id: '1y',    label: '一年',   goal: 600 },
  { id: 'total', label: '總計',   goal: 1000 },
];
const WK = ['日','一','二','三','四','五','六'];

// =============== 讀取工具 ===============
const _fetchCache = new Map();   // 點擊計數（不存在 = 0）
const _rawCache = new Map();     // 快照（不存在 = null）
async function fetchKey(key) {
  if (_fetchCache.has(key)) return _fetchCache.get(key);
  const p = (async () => {
    try {
      const r = await fetch(`${API_BASE}/get/${NS}/${key}`);
      if (!r.ok) return 0;
      const j = await r.json();
      return j.error ? 0 : (j.value ?? 0);
    } catch (e) { _fetchCache.delete(key); return 0; }
  })();
  _fetchCache.set(key, p);
  return p;
}
async function getRaw(key) {
  if (_rawCache.has(key)) return _rawCache.get(key);
  const p = (async () => {
    try {
      const r = await fetch(`${API_BASE}/get/${NS}/${key}`);
      if (!r.ok) return null;
      const j = await r.json();
      return (typeof j.value === 'number') ? j.value : null;
    } catch (e) { _rawCache.delete(key); return null; }
  })();
  _rawCache.set(key, p);
  return p;
}
function clearCaches() { _fetchCache.clear(); _rawCache.clear(); }

// =============== 日期工具 ===============
const pad = n => n < 10 ? '0' + n : '' + n;
const dayKey = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}${pad(d.getMonth()+1)}`;
const ymdDate = s => new Date(+s.slice(0,4), +s.slice(4,6) - 1, +s.slice(6,8));
const addDays = (s, n) => { const d = ymdDate(s); d.setDate(d.getDate() + n); return dayKey(d); };
const fmtMD = s => (s && s.length === 8) ? `${+s.slice(4,6)}/${+s.slice(6,8)}` : '—';
function isoWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = (dt.getUTCDay() + 6) % 7;
  dt.setUTCDate(dt.getUTCDate() - dn + 3);
  const ft = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  const w = 1 + Math.round(((dt - ft) / 86400000 - 3 + ((ft.getUTCDay() + 6) % 7)) / 7);
  return dt.getUTCFullYear() + 'W' + pad(w);
}
function lastNMonths(n) {
  const arr = [], t = new Date();
  for (let i = 0; i < n; i++) arr.push(monthKey(new Date(t.getFullYear(), t.getMonth() - i, 1)));
  return arr;
}
function lastNDays(n) {
  const arr = [], t = dayKey(new Date());
  for (let i = 0; i < n; i++) arr.push(addDays(t, -i));
  return arr;   // 最新在前
}
// 期間第一天（實際加入從「前一天收盤」算起）
function periodStart(id) {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  if (id === 'today') return dayKey(t);
  if (id === 'week')  { const d = new Date(t); d.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return dayKey(d); }
  if (id === 'month') return dayKey(new Date(y, m, 1));
  if (id === '3m')    return dayKey(new Date(y, m - 2, 1));
  if (id === '6m')    return dayKey(new Date(y, m - 5, 1));
  if (id === '1y')    return dayKey(new Date(y, m - 11, 1));
  return addDays(SINCE_YMD, 1);   // total
}

// =============== 格式工具 ===============
function fmtDelta(n, unit = '') {
  if (n == null) return '—';
  if (n === 0) return '±0' + unit;
  return (n > 0 ? '+' : '') + n.toLocaleString() + unit;
}
const cls = n => (n == null || n === 0) ? 'flat' : (n > 0 ? 'up' : 'down');

// =============== 點擊計數 ===============
async function getClicks(brand, period) {
  const dk = DATA_KEY[brand], t = new Date();
  if (period === 'today') return fetchKey(`${dk}-d-${dayKey(t)}`);
  if (period === 'week')  return fetchKey(`${dk}-w-${isoWeek(t)}`);
  if (period === 'month') return fetchKey(`${dk}-m-${monthKey(t)}`);
  const n = { '3m': 3, '6m': 6, '1y': 12 }[period];
  if (n) return (await Promise.all(lastNMonths(n).map(mk => fetchKey(`${dk}-m-${mk}`)))).reduce((a, b) => a + b, 0);
  if (period === 'total') return fetchKey(dk);
  return 0;
}
const dayClicks = (brand, ymd) => fetchKey(`${DATA_KEY[brand]}-d-${ymd}`);

// =============== 真實數據 ===============
let EXT = null;
const snapMap = { line: new Map(), fb: new Map(), google: new Map() };

async function fetchExternalData() {
  if (REAL_DATA_MODE === 'manual') return await buildManualExternal();
  const r = await fetch(`${API_BASE}/external`);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// manual 模式：從 rd-* 鍵組成與 /external 相同結構，並寫入當天快照
async function buildManualExternal() {
  const today = dayKey(new Date());
  async function series(rdKey) {
    const current = await fetchKey(rdKey);
    if (current > 0) {
      try { await fetch(`${API_BASE}/set/${NS}/${rdKey}-d-${today}?v=${current}`); } catch (e) {}
    }
    const days = lastNDays(60);
    const vals = await Promise.all(days.map(d => fetchKey(`${rdKey}-d-${d}`)));
    const history = days.map((d, i) => ({ date: d, value: vals[i] })).filter(h => h.value > 0);
    const valAt = n => { const h = history.find(x => x.date === addDays(today, -n)); return h ? h.value : null; };
    const w = valAt(7), m = valAt(30);
    return { current, asOf: today, history,
             deltaWeek: w != null ? current - w : null, deltaMonth: m != null ? current - m : null };
  }
  const [line, fb, google] = await Promise.all([series('rd-line'), series('rd-fb'), series('rd-google')]);
  const rating = await fetchKey('rd-google-rating');
  google.rating = rating ? (rating / 10).toFixed(1) : null;   // 存 48 → 4.8
  return { line, fb, google };
}

function extOk(b) { return EXT && EXT[b] && !EXT[b].error && EXT[b].current != null; }
function asOf(b)  { return (EXT && EXT[b] && EXT[b].asOf) || dayKey(new Date()); }

// 某天收盤值：最新一天用即時值，其餘先查 /external 的 history，沒有再讀 KV
async function snapAt(b, ymd) {
  if (extOk(b) && ymd === asOf(b)) return EXT[b].current;
  if (snapMap[b].has(ymd)) return snapMap[b].get(ymd);
  for (const p of SNAP_PREFIX[b]) {
    const v = await getRaw(p + ymd);
    if (v != null) return v;
  }
  return null;
}

// 從 startYmd 當天到最新一天的實際增加（基準 = startYmd 前一天收盤，不早於 SINCE_YMD）
// 回傳 { value, base, clamped } 或 null（資料不足 / LINE 尚未結算）
async function actualSince(b, startYmd) {
  if (!extOk(b)) return null;
  const end = asOf(b);
  let d = addDays(startYmd, -1);
  const clamped = d < SINCE_YMD;
  if (clamped) d = SINCE_YMD;
  for (let i = 0; i < 14 && d < end; i++, d = addDays(d, 1)) {
    const v = await snapAt(b, d);
    if (v != null) return { value: EXT[b].current - v, base: d, baseValue: v, clamped };
  }
  // manual 模式：店家各自開始記錄的日期不同，找不到就改用期間內最早一筆快照
  if (REAL_DATA_MODE === 'manual') {
    const base0 = clamped ? SINCE_YMD : addDays(startYmd, -1);
    const h = (EXT[b].history || []).filter(x => x.date >= base0 && x.date < end).pop();   // history 最新在前 → pop 取最早
    if (h) return { value: EXT[b].current - h.value, base: h.date, baseValue: h.value, clamped: true };
  }
  return null;
}

// 單日實際增加 = 當天收盤 − 前一天收盤
async function dayActual(b, ymd) {
  if (!extOk(b) || ymd > asOf(b) || addDays(ymd, -1) < SINCE_YMD) return null;
  const [v1, v0] = await Promise.all([snapAt(b, ymd), snapAt(b, addDays(ymd, -1))]);
  return (v1 != null && v0 != null) ? v1 - v0 : null;
}

async function loadExternal() {
  if (REAL_DATA_MODE === 'off') return;
  try {
    EXT = await fetchExternalData();
    BRANDS.forEach(b => {
      snapMap[b].clear();
      ((EXT[b] && EXT[b].history) || []).forEach(h => snapMap[b].set(h.date, h.value));
    });
    document.getElementById('ext-meta-r').textContent = EXT.cached
      ? '快取資料（5 分鐘內更新一次）'
      : '剛剛更新 · ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    console.warn('[external] fetch failed:', e);
    document.getElementById('ext-meta-r').textContent = '⚠️ 無法連線';
  }
}

// =============== ① 真實數據卡 ===============
const sparkCharts = {};
async function renderKPI() {
  if (REAL_DATA_MODE === 'off') return;
  const order = ['line', 'google', 'fb'];
  const grid = document.getElementById('kpi-grid');
  if (!grid.children.length) {
    grid.innerHTML = order.map(b => `
      <div class="card kpi ${b}">
        <div class="kpi-head"><span class="nm"><span class="dot"></span>${META[b].name}</span><span id="k-${b}-asof">—</span></div>
        <div class="kpi-cur num" id="k-${b}-cur">—</div>
        <div class="chips num">
          <span class="chip"><span class="lb">近 7 天</span><span id="k-${b}-w">—</span></span>
          <span class="chip"><span class="lb">近 30 天</span><span id="k-${b}-m">—</span></span>
        </div>
        <div class="since">
          <div><div class="lb">累計增加</div><div class="note" id="k-${b}-note">自 ${fmtMD(SINCE_YMD)} 起</div></div>
          <div class="v num" id="k-${b}-since">—</div>
        </div>
        <div class="spark"><canvas id="k-${b}-spark"></canvas></div>
      </div>`).join('');
  }
  await Promise.all(order.map(async b => {
    const x = EXT && EXT[b], u = META[b].unit;
    const $ = id => document.getElementById(`k-${b}-${id}`);
    if (!extOk(b)) {
      $('cur').textContent = '—';
      $('asof').textContent = (x && x.error) ? '⚠️ API 錯誤' : '載入中';
      return;
    }
    $('cur').innerHTML = x.current.toLocaleString() + (b === 'google' ? '<small>則</small>' : '');
    $('asof').textContent = b === 'google' ? `⭐ ${x.rating ?? '—'}`
                          : (b === 'line' ? '截至 ' : '更新於 ') + fmtMD(x.asOf);
    [['w', x.deltaWeek], ['m', x.deltaMonth]].forEach(([k, n]) => {
      $(k).textContent = fmtDelta(n, u); $(k).className = cls(n);
    });
    const s = await actualSince(b, addDays(SINCE_YMD, 1));
    if (s) {
      $('since').textContent = fmtDelta(s.value, u);
      $('since').className = 'v num ' + cls(s.value);
      $('note').textContent = `自 ${fmtMD(s.base)} 起 · ${s.baseValue.toLocaleString()} → ${x.current.toLocaleString()}`;
    } else {
      $('since').textContent = '—'; $('since').className = 'v num flat';
    }
    renderSpark(`k-${b}-spark`, x.history, META[b].color);
  }));
}

function renderSpark(id, history, color) {
  const hist = (history || []).slice().reverse();
  const wrap = document.getElementById(id).parentElement;
  wrap.querySelector('.spark-empty')?.remove();
  if (sparkCharts[id]) { sparkCharts[id].destroy(); sparkCharts[id] = null; }
  if (hist.length < 2) {
    const e = document.createElement('div');
    e.className = 'spark-empty';
    e.textContent = hist.length ? '累積中…（明天起會出現趨勢）' : '尚未開始累積';
    wrap.appendChild(e);
    return;
  }
  sparkCharts[id] = new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels: hist.map(h => fmtMD(h.date)),
            datasets: [{ data: hist.map(h => h.value), borderColor: color, backgroundColor: color + '26',
                         borderWidth: 2, tension: 0.35, fill: true, pointRadius: 0, pointHoverRadius: 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false },
                 tooltip: { backgroundColor: '#000', titleColor: '#FFD500', bodyColor: '#fff', borderColor: '#3a3a3c',
                            borderWidth: 1, displayColors: false, callbacks: { label: c => c.parsed.y.toLocaleString() } } },
      scales: { x: { display: false }, y: { display: false, grace: '5%' } },
      interaction: { mode: 'nearest', intersect: false }
    }
  });
}

// =============== ② 點擊 × 實際加入 ===============
let currentPeriod = 'today';
function renderTabs() {
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  PERIODS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (p.id === currentPeriod ? ' active' : '');
    btn.textContent = p.label;
    btn.onclick = () => { currentPeriod = p.id; renderTabs(); renderCompare(); };
    t.appendChild(btn);
  });
}

async function renderCompare() {
  const card = document.getElementById('cmp-card');
  card.classList.add('loading');
  const id = currentPeriod, period = PERIODS.find(p => p.id === id), start = periodStart(id);
  const clicks  = await Promise.all(BRANDS.map(b => getClicks(b, id)));
  const actuals = REAL_DATA_MODE === 'off' ? BRANDS.map(() => null)
                : await Promise.all(BRANDS.map(b => actualSince(b, start)));
  if (id !== currentPeriod) return;   // 期間已切換，捨棄舊結果

  const cell = (b, nm, clk, act, unit, goal) => `
    <div class="cmp ${b}">
      <div class="cmp-nm">${b === 'total' ? '' : '<span class="dot"></span>'}${nm}</div>
      <div class="cmp-row"><span class="lb">點擊</span><span class="v num">${clk.toLocaleString()}<small>次</small></span></div>
      ${goal ? `<div class="bar"><i style="width:${Math.min(clk / goal, 1) * 100}%"></i></div>
                <div class="goal num">目標 ${goal}　·　${Math.round(clk / goal * 100)}%</div>` : ''}
      <div class="cmp-row actual"><span class="lb">實際加入</span><span class="v num ${cls(act)}">${fmtDelta(act, unit)}</span></div>
      <div class="cmp-row conv actual"><span class="lb">加入 ÷ 點擊</span><span class="v num">${(act != null && clk > 0) ? Math.round(act / clk * 100) + '%' : '—'}</span></div>
    </div>`;

  const totalClk = clicks.reduce((a, b) => a + b, 0);
  const totalAct = actuals.some(a => a) ? actuals.reduce((s, a) => s + (a ? a.value : 0), 0) : null;
  document.getElementById('cmp-grid').innerHTML =
    BRANDS.map((b, i) => cell(b, META[b].click, clicks[i], actuals[i] ? actuals[i].value : null, META[b].unit, period.goal)).join('') +
    cell('total', id === 'total' ? '全部合計' : `${period.label}合計`, totalClk, totalAct, '', 0);

  // 說明：基準日、LINE 隔日結算、起點限制
  const notes = [];
  const late = BRANDS.map((b, i) => [b, actuals[i]]).filter(([b, a]) => a && a.base > addDays(start, -1));
  if (late.length) notes.push('以下平台在此期間開始時還沒有紀錄，改從最早一筆起算：'
    + late.map(([b, a]) => `${META[b].name} ${fmtMD(a.base)}`).join('、') + '。');
  if (REAL_DATA_MODE === 'api' && extOk('line') && asOf('line') < start) notes.push(`LINE 好友數隔天才結算（目前截至 ${fmtMD(asOf('line'))}），今日數字明天顯示。`);
  notes.push('實際加入含非落地頁來源（例如店內直接加好友），比例僅供參考。');
  document.getElementById('cmp-foot').innerHTML = notes.join('<br>');
  card.classList.remove('loading');
}

// =============== ③ 每日明細（近 14 天） ===============
async function renderDaily() {
  const days = lastNDays(14), today = dayKey(new Date());
  const rows = await Promise.all(days.map(async d => ({
    d,
    clk: await Promise.all(BRANDS.map(b => dayClicks(b, d))),
    act: REAL_DATA_MODE === 'off' ? [null, null, null] : await Promise.all(BRANDS.map(b => dayActual(b, d))),
  })));
  const td = (clk, act) => `<td class="clk gap-l">${clk}</td><td class="act actual ${cls(act)}">${fmtDelta(act)}</td>`;
  document.getElementById('daily-body').innerHTML = rows.map(r => {
    const dt = ymdDate(r.d);
    return `<tr class="${r.d === today ? 'today' : ''}"><td>${fmtMD(r.d)}<span class="wk">${WK[dt.getDay()]}</span></td>` +
           BRANDS.map((b, i) => td(r.clk[i], r.act[i])).join('') + '</tr>';
  }).join('');
  const sum = (k, i) => {
    const vals = rows.map(r => r[k][i]).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
  };
  document.getElementById('daily-foot').innerHTML =
    '<tr><td>14 天合計</td>' + BRANDS.map((b, i) => td(sum('clk', i), sum('act', i))).join('') + '</tr>';
}

// =============== 月曆 ===============
let calYear, calMonth, selectedDate;
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

function renderCalendar() {
  const today = new Date();
  const first = new Date(calYear, calMonth, 1);
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  document.getElementById('cal-title').textContent = `${calYear} 年 ${calMonth + 1} 月`;
  document.getElementById('cal-next').disabled =
    calYear > today.getFullYear() || (calYear === today.getFullYear() && calMonth >= today.getMonth());
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  for (let i = 0; i < first.getDay(); i++) {
    const e = document.createElement('div'); e.className = 'cal-cell empty'; grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d);
    const isFuture = date > today && !sameDay(date, today);
    const btn = document.createElement('button');
    btn.className = 'cal-cell' + (isFuture ? ' future' : '') + (sameDay(date, today) ? ' today' : '')
                  + (selectedDate && sameDay(date, selectedDate) ? ' selected' : '');
    btn.textContent = d;
    if (!isFuture) {
      btn.onclick = () => selectDate(date);
      Promise.all(BRANDS.map(b => dayClicks(b, dayKey(date)))).then(c => {
        if (c.reduce((a, b) => a + b, 0) > 0 && !btn.classList.contains('selected')) {
          const dot = document.createElement('div'); dot.className = 'activity'; btn.appendChild(dot);
        }
      });
    }
    grid.appendChild(btn);
  }
}

function selectDate(date) { selectedDate = date; renderCalendar(); loadDayDetail(date); }

async function loadDayDetail(date) {
  const ymd = dayKey(date);
  document.getElementById('day-title').innerHTML =
    `${date.getMonth() + 1} 月 ${date.getDate()} 日<span class="wk">星期${WK[date.getDay()]}</span>` +
    (sameDay(date, new Date()) ? '<span class="badge">今天</span>' : '');
  const body = document.getElementById('day-body');
  body.innerHTML = '<tr><td colspan="3" class="flat">載入中…</td></tr>';
  const clk = await Promise.all(BRANDS.map(b => dayClicks(b, ymd)));
  const act = REAL_DATA_MODE === 'off' ? [null, null, null] : await Promise.all(BRANDS.map(b => dayActual(b, ymd)));
  if (dayKey(selectedDate) !== ymd) return;
  const tc = clk.reduce((a, b) => a + b, 0);
  const ta = act.some(v => v != null) ? act.reduce((s, v) => s + (v || 0), 0) : null;
  body.innerHTML = BRANDS.map((b, i) => `
    <tr class="${b}"><td class="nm"><span class="dot"></span>${META[b].click}</td>
      <td class="clk">${clk[i]} 次</td><td class="act actual ${cls(act[i])}">${fmtDelta(act[i], META[b].unit)}</td></tr>`).join('') +
    `<tr><td><b>當日合計</b></td><td class="clk"><b>${tc} 次</b></td><td class="act actual ${cls(ta)}"><b>${fmtDelta(ta)}</b></td></tr>`;
}

document.getElementById('cal-prev').onclick = () => { if (--calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); };
document.getElementById('cal-next').onclick = () => { if (++calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); };
document.getElementById('cal-today').onclick = () => { const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); selectDate(t); };

// =============== 整體載入 ===============
async function loadAll(force = false) {
  if (force) clearCaches();
  const now = new Date();
  document.getElementById('today-date').textContent =
    `${now.getMonth() + 1} 月 ${now.getDate()} 日 星期${WK[now.getDay()]}`;
  await loadExternal();
  await Promise.all([renderKPI(), renderCompare(), renderDaily(), loadDayDetail(selectedDate)]);
  renderCalendar();
  document.getElementById('meta').textContent =
    `最後更新 ${new Date().toLocaleTimeString('zh-TW', { hour12: false })}　·　每 60 秒自動更新`;
}

// =============== Excel 匯出 ===============
async function exportExcel() {
  const btn = document.getElementById('btn-excel');
  btn.textContent = '產生中…'; btn.disabled = true;
  try {
    const withActual = REAL_DATA_MODE !== 'off';
    const totals = await Promise.all(BRANDS.map(b => fetchKey(DATA_KEY[b])));
    const summary = [
      ['指標', '數量'],
      ['點選 LINE 好友（累計點擊）', totals[0]],
      ['點進 FB 粉絲團（累計點擊）', totals[1]],
      ['點進 Google 評論（累計點擊）', totals[2]],
      ['總點擊數', totals.reduce((a, b) => a + b, 0)],
    ];
    if (withActual) {
      summary.push(['', '']);
      for (const b of BRANDS) {
        const s = await actualSince(b, addDays(SINCE_YMD, 1));
        summary.push([`${META[b].name} 目前`, extOk(b) ? EXT[b].current : '—']);
        summary.push([`${META[b].name} 累計增加（自 ${s ? fmtMD(s.base) : fmtMD(SINCE_YMD)}）`, s ? s.value : '—']);
      }
    }
    summary.push(['', ''], ['報表產生時間', new Date().toLocaleString('zh-TW')],
                 ['店家', '燦坤華榮 AppleShop'], ['網址', 'https://magicbrian1206-maker.github.io/landing/']);

    const head = ['日期', '星期', 'LINE 點擊', 'FB 點擊', 'Google 點擊', '點擊合計'];
    if (withActual) head.push('LINE 實際加入', 'FB 實際加入', 'Google 實際增加');
    const daily = [head];
    for (const d of lastNDays(90).reverse()) {
      const c = await Promise.all(BRANDS.map(b => dayClicks(b, d)));
      const row = [`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, WK[ymdDate(d).getDay()], ...c, c.reduce((a, b) => a + b, 0)];
      if (withActual) (await Promise.all(BRANDS.map(b => dayActual(b, d)))).forEach(v => row.push(v ?? ''));
      daily.push(row);
    }

    const monthly = [['月份', 'LINE 點擊', 'FB 點擊', 'Google 點擊', '點擊合計']];
    for (const m of lastNMonths(12).reverse()) {
      const c = await Promise.all(BRANDS.map(b => fetchKey(`${DATA_KEY[b]}-m-${m}`)));
      monthly.push([`${m.slice(0,4)}-${m.slice(4,6)}`, ...c, c.reduce((a, b) => a + b, 0)]);
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '總覽');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(daily), '每日紀錄_近90天');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(monthly), '每月點擊_近12月');
    XLSX.writeFile(wb, `燦坤華榮AppleShop-活動紀錄-${dayKey(new Date())}.xlsx`);
  } catch (e) {
    alert('匯出失敗：' + e.message);
  } finally {
    btn.textContent = '下載 Excel'; btn.disabled = false;
  }
}

// =============== 啟動 ===============
if (REAL_DATA_MODE === 'off') {
  document.body.classList.add('mode-off');
  document.querySelectorAll('th[colspan="2"]').forEach(th => th.colSpan = 1);   // 只剩點擊一欄
}
(function init() {
  const t = new Date();
  calYear = t.getFullYear(); calMonth = t.getMonth(); selectedDate = t;
  renderTabs();
  renderCalendar();
  loadAll();
  setInterval(() => loadAll(true), 60000);
})();
</script>
